name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

jobs:
  mcp-contract:
    name: MCP contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Reject tracked CRLF text
        shell: pwsh
        run: ./scripts/Test-TrackedTextLF.ps1

      - name: Run MCP contract tests without touching the runner home
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false

          $runnerTemp = [System.IO.Path]::GetFullPath($env:RUNNER_TEMP)
          $sentinelHome = [System.IO.Path]::GetFullPath((Join-Path $runnerTemp 'dirextalk-mcp-sentinel-home'))
          $runtimeState = [System.IO.Path]::GetFullPath((Join-Path $runnerTemp 'dirextalk-mcp-runtime-state'))
          $safePrefix = $runnerTemp.TrimEnd([System.IO.Path]::DirectorySeparatorChar, [System.IO.Path]::AltDirectorySeparatorChar) + [System.IO.Path]::DirectorySeparatorChar
          foreach ($target in @($sentinelHome, $runtimeState)) {
            if (-not $target.StartsWith($safePrefix, [System.StringComparison]::OrdinalIgnoreCase)) {
              throw "Unsafe CI cleanup target outside RUNNER_TEMP: $target"
            }
          }
          ./scripts/Assert-SafeSentinelPath.ps1 -SentinelHome $sentinelHome -TempRoot $runnerTemp | Out-Null
          ./scripts/Assert-SafeSentinelPath.ps1 -SentinelHome $runtimeState -TempRoot $runnerTemp | Out-Null
          Remove-Item -LiteralPath $sentinelHome -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $runtimeState -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $sentinelHome | Out-Null
          New-Item -ItemType Directory -Force -Path $runtimeState | Out-Null

          $env:HOME = $sentinelHome
          $env:USERPROFILE = $sentinelHome
          if ($IsWindows) {
            $homeDriveRoot = [System.IO.Path]::GetPathRoot($sentinelHome)
            $env:HOMEDRIVE = $homeDriveRoot.TrimEnd([System.IO.Path]::DirectorySeparatorChar, [System.IO.Path]::AltDirectorySeparatorChar)
            $env:HOMEPATH = $sentinelHome.Substring($env:HOMEDRIVE.Length)
          } else {
            $env:HOMEDRIVE = $sentinelHome
            $env:HOMEPATH = $sentinelHome
          }
          $env:APPDATA = Join-Path $runtimeState 'AppData/Roaming'
          $env:LOCALAPPDATA = Join-Path $runtimeState 'AppData/Local'
          $env:XDG_CONFIG_HOME = Join-Path $sentinelHome '.config'
          $env:XDG_DATA_HOME = Join-Path $sentinelHome '.local/share'
          $env:DIREXTALK_HOME = Join-Path $sentinelHome '.dirextalk'
          $env:CODEX_HOME = Join-Path $sentinelHome '.codex'
          $env:CLAUDE_CONFIG_DIR = Join-Path $sentinelHome '.claude'
          $env:PI_CODING_AGENT_DIR = Join-Path $sentinelHome '.pi/agent'
          $env:GEMINI_CLI_SYSTEM_SETTINGS_PATH = Join-Path $sentinelHome '.gemini/system-settings.json'
          $env:CC_CONFIG_PATH = Join-Path $sentinelHome '.cc-connect/config.toml'
          $env:CC_DATA_DIR = Join-Path $sentinelHome '.cc-connect'
          $env:TMP = Join-Path $runtimeState 'tmp'
          $env:TEMP = $env:TMP
          $env:TMPDIR = $env:TMP
          New-Item -ItemType Directory -Force -Path $env:TMP | Out-Null
          $env:GOCACHE = Join-Path $env:RUNNER_TEMP 'dirextalk-mcp-go-cache'
          $env:GOTELEMETRY = 'off'
          $env:POWERSHELL_TELEMETRY_OPTOUT = '1'

          $seedFiles = @(
            '.copilot/mcp-config.json',
            '.gemini/settings.json',
            '.gemini/system-settings.json',
            '.gemini/config/mcp_config.json',
            '.gemini/antigravity/mcp_config.json',
            '.cursor/mcp.json',
            '.iflow/settings.json',
            '.config/opencode/opencode.json',
            '.pi/agent/mcp.json'
          )
          foreach ($relativePath in $seedFiles) {
            $path = Join-Path $sentinelHome $relativePath
            New-Item -ItemType Directory -Force -Path (Split-Path -Parent $path) | Out-Null
            [System.IO.File]::WriteAllText($path, '{"sentinel":true}', [System.Text.UTF8Encoding]::new($false))
          }

          $protectedRoots = @(
            '.copilot', '.gemini', '.cursor', '.iflow', '.config/opencode',
            '.pi', '.codex', '.claude', '.dirextalk', '.cc-connect'
          )
          function Get-SentinelSnapshot {
            foreach ($relativeRoot in $protectedRoots) {
              $root = Join-Path $sentinelHome $relativeRoot
              if (Test-Path -LiteralPath $root) {
                Get-ChildItem -LiteralPath $root -Recurse -File | ForEach-Object {
                  $relative = [System.IO.Path]::GetRelativePath($sentinelHome, $_.FullName)
                  "$relative`t$((Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash)"
                }
              }
            }
          }

          $before = @(Get-SentinelSnapshot | Sort-Object)
          $packages = @(
            './core', './config', './internal/testutil', './internal/securetemp',
            './agent/acp', './agent/antigravity', './agent/claudecode',
            './agent/codex', './agent/copilot', './agent/cursor',
            './agent/gemini', './agent/iflow', './agent/kimi',
            './agent/opencode', './agent/pi', './agent/qoder',
            './agent/reasonix', './agent/tmux',
            './tests/mcp_contract', './tests/line_endings', './tests/sentinel_guard'
          )
          & go test @packages -run 'MCP|Capability|SecureTemp|ACL|TrackedTextLF|IsolatedHome|SafeSentinel' -count=1
          $testExit = $LASTEXITCODE
          $after = @(Get-SentinelSnapshot | Sort-Object)

          if (Compare-Object -ReferenceObject $before -DifferenceObject $after) {
            throw 'MCP contract tests modified the sentinel home/config tree.'
          }
          if ($testExit -ne 0) {
            exit $testExit
          }

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build web assets
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Lint code
        run: |
          set -euo pipefail
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.11.4
          LINT_BIN="$(go env GOPATH)/bin/golangci-lint"

          run_lint() {
            "$LINT_BIN" run "$@" || {
              code=$?
              # exit code 5 = "no go files to analyze" (e.g. only non-Go files changed) — not a lint failure
              [ "$code" -eq 5 ] && return 0
              return "$code"
            }
          }

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            run_lint --new-from-rev "origin/${{ github.base_ref }}" ./...
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            run_lint --new-from-rev "${{ github.event.before }}" ./...
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            run_lint --new-from-rev "$(git rev-parse HEAD^)" ./...
          else
            run_lint ./...
          fi

      - name: Lint GitHub workflows
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.8
          "$(go env GOPATH)/bin/actionlint" -color

  unit-test:
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build web assets
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Download dependencies
        run: go mod download
        env:
          GOPROXY: https://proxy.golang.org,direct
          GOSUMDB: sum.golang.org
          GONOSUMDB: ""

      - name: Verify module checksums
        run: go mod verify
        env:
          GOPROXY: https://proxy.golang.org,direct
          GOSUMDB: sum.golang.org
          GONOSUMDB: ""

      - name: Build
        run: go build ./...

      - name: Run tests
        run: go test ./... -v -race

      - name: Run tests with coverage
        run: go test ./... -coverprofile=coverage.out -covermode=atomic

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: github.event_name == 'push'
        with:
          files: ./coverage.out
          fail_ci_if_error: false

  smoke-test:
    runs-on: ubuntu-latest
    needs: unit-test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run smoke tests
        run: go test -v -tags=smoke,no_web ./tests/e2e/...

  regression-test:
    runs-on: ubuntu-latest
    needs: smoke-test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run regression tests
        run: go test -v -tags=regression,no_web ./tests/e2e/...

  performance-test:
    runs-on: ubuntu-latest
    needs: regression-test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run performance benchmarks
        run: go test -bench=. -benchmem -tags=performance,no_web ./tests/performance/...
