# dirextalk-connect configuration
# Docs: https://github.com/YingSuiAI/dirextalk-connect
#
# This distribution is Dirextalk-only. The only supported platform type is
# "matrix", and the Matrix account should be the local @agent:<server> user
# returned by Dirextalk agent.matrix_session.create.

language = "zh"
data_dir = "~/.dirextalk-connect"

[log]
level = "info"

[display]
mode = "full"
reply_footer = true
show_context_indicator = true

[stream_preview]
enabled = true
interval_ms = 1500

[rate_limit]
max_messages = 20
window_secs = 60

[[projects]]
name = "dirextalk-agent-room"

[projects.agent]
type = "<agent-backend>"
# Replace <agent-backend> with the local runtime to bridge, for example:
# acp, claudecode, codex, gemini, cursor, copilot, qoder, or opencode.
# For Hermes ACP, replace this agent block with:
# [projects.agent]
# type = "acp"
# [projects.agent.options]
# work_dir = "/path/to/project"
# cmd = "dirextalk-connect"
# args = ["hermes-acp-adapter", "--", "hermes", "acp"]
# display_name = "Hermes ACP"

[projects.agent.options]
work_dir = "/path/to/project"

[[projects.platforms]]
type = "matrix"

[projects.platforms.options]
homeserver = "https://im.example.com"
access_token = "agent-matrix-access-token"
user_id = "@agent:im.example.com"
device_id = "DIREXTALK_CC_CONNECT"
# Required: the real persisted Dirextalk agent_room_id. Do not use !agent:<server>.
room_id = "!real-agent-room:im.example.com"
share_session_in_channel = true
group_reply_all = true
auto_join = false
auto_verify = false
